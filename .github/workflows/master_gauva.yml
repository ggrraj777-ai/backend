name: Deploy Laravel Backend to Azure

on:
  push:
    branches:
      - main

env:
  AZURE_WEBAPP_NAME: hanusattva-backend      # change to your Azure App Service name
  AZURE_RESOURCE_GROUP: hanusattva-resource  # your resource group name
  AZURE_CONTAINER_REGISTRY: hanusattvaacr.azurecr.io  # replace with your ACR URL
  DOCKER_IMAGE: hanusattva-backend:latest

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, gd, intl, pdo, pdo_mysql

      - name: Install Composer dependencies
        run: |
          cp .env.example .env
          composer install --no-dev --optimize-autoloader
          php artisan key:generate
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache

      - name: Install Node.js and build assets
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: |
          npm ci
          npm run build

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v2
        with:
          login-server: ${{ env.AZURE_CONTAINER_REGISTRY }}
          username: ${{ secrets.AZURE_REGISTRY_USERNAME }}
          password: ${{ secrets.AZURE_REGISTRY_PASSWORD }}

      - name: Build and push Docker image
        run: |
          docker build -t ${{ env.AZURE_CONTAINER_REGISTRY }}/${{ env.DOCKER_IMAGE }} .
          docker push ${{ env.AZURE_CONTAINER_REGISTRY }}/${{ env.DOCKER_IMAGE }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          images: ${{ env.AZURE_CONTAINER_REGISTRY }}/${{ env.DOCKER_IMAGE }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}

      - name: Run database migrations (optional)
        run: |
          echo "Running migrations..."
          az webapp ssh --name ${{ env.AZURE_WEBAPP_NAME }} --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --command "php artisan migrate --force"
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Done
        run: echo "🚀 Hanusattva Backend successfully deployed to Azure!"
