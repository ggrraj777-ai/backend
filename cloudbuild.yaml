steps:
  # Build the container image with verbose output
  - name: 'gcr.io/cloud-builders/docker'
    args: 
      - 'build'
      - '--progress=plain'
      - '-t'
      - 'gcr.io/$PROJECT_ID/drivemond-backend:$SHORT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/drivemond-backend:latest'
      - '.'
    timeout: 2400s
  
  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/drivemond-backend:$SHORT_SHA']
  
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/drivemond-backend:latest']
  
  # Deploy container image to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'gauva'
      - '--image=gcr.io/$PROJECT_ID/drivemond-backend:$SHORT_SHA'
      - '--region=europe-west1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=1Gi'
      - '--cpu=2'
      - '--timeout=300'
      - '--max-instances=10'
      - '--min-instances=0'

images:
  - 'gcr.io/$PROJECT_ID/drivemond-backend:$SHORT_SHA'
  - 'gcr.io/$PROJECT_ID/drivemond-backend:latest'

timeout: 3600s

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
  diskSizeGb: 100
  substitution_option: 'ALLOW_LOOSE'
